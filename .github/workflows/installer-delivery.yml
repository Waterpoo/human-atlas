name: Deliver tested Mac installers
on:
  pull_request:
    paths: ['.github/workflows/installer-delivery.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Verify tested source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/Waterpoo/human-atlas/actions/runs/37648678710", headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          run = json.load(urllib.request.urlopen(req))
          assert run["head_sha"] == "4b7c338f68c7919ae9d502ee0a66874c1b65a4f2"
          assert run["conclusion"] == "success"
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37648678710
          name: Halo-Anatomy-Mac-arm64
          path: installers/arm64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37648678710
          name: Halo-Anatomy-Mac-x64
          path: installers/x64
      - name: Verify DMG containers and record checksums
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          files = sorted(pathlib.Path("installers").glob("*/*.dmg"))
          assert len(files) == 2
          for path in files:
              with path.open("rb") as f:
                  f.seek(-512, 2)
                  assert f.read(4) == b"koly", path
              print(hashlib.sha256(path.read_bytes()).hexdigest(), path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Anatomy-1.3.0-Apple-Silicon-DMG
          path: installers/arm64/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Anatomy-1.3.0-Intel-DMG
          path: installers/x64/*.dmg
          if-no-files-found: error
